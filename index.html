                if (this.elements.themeToggleBtn) this.elements.themeToggleBtn.textContent = isDarkMode ?
                    '☀️ 浅色模式' : '🌙 深色模式';
            },
            loadThemePreference() {
                const isDarkMode = this.storage.load('darkMode', false);
                if (isDarkMode) { document.body.classList.add('dark-mode'); if (this.elements.themeToggleBtn) this
                        .elements.themeToggleBtn.textContent = '☀️ 浅色模式'; }
            },
            getEffectiveUserId() {
                if (this.state.currentUser) return this.state.currentUser.id;
                if (this.state.guestId) return this.state.guestId;
                return null;
            },
            openDeleteModal(id) { this.state.currentDeleteId = id; if (this.elements.deleteModal) this.elements
                    .deleteModal.style.display = 'flex'; },
            closeDeleteModal() { this.state.currentDeleteId = null; if (this.elements.deleteModal) this.elements
                    .deleteModal.style.display = 'none'; },
            async confirmDelete() {
                const id = this.state.currentDeleteId;
                if (!id) { this.closeDeleteModal(); return; }
                try {
                    const currentUserId = this.getEffectiveUserId();
                    if (!currentUserId) { alert('请先设置昵称');
                        this.closeDeleteModal(); return; }
                    const { data: letter, error: fetchError } = await this.supabase.from(this.config.tableName)
                        .select('user_id').eq('id', id).single();
                    if (fetchError) throw new Error('获取情书信息失败');
                    if (String(letter.user_id) !== String(currentUserId)) throw new Error('权限不足，无法删除此情书');
                    const { error } = await this.supabase.from(this.config.tableName).delete().eq('id', id).eq(
                        'user_id', String(currentUserId));
                    if (error) throw new Error(this.getErrorMessage(error));
                    if (this.state.votedIds.has(id)) { this.state.votedIds.delete(id);
                        this.saveVotedIds(); }
                    this.cache.clear();
                    await this.loadData(this.state.currentMode, this.elements.searchInput.value);
                    alert('删除成功');
                } catch (error) { alert('删除失败：' + error.message); } finally { this.closeDeleteModal(); }
            }
        };

            saveConfig() {

            async syncToCloud() {
                try {
                    const user = App.state?.currentUser;
                    if (!user) return;
                    const petConfigData = { user_id: user.id, pet_type: this.currentConfig.type,
                        parts_json: JSON.stringify(this.currentConfig) };
                    const { data: existing } = await App.supabase.from('pet_config').select('id').eq('user_id',
                        user.id).single();
                    if (existing) await App.supabase.from('pet_config').update(petConfigData).eq('user_id', user
                        .id);
                    else await App.supabase.from('pet_config').insert(petConfigData);
                } catch (e) {}

            // ---- 骨骼创建 ----

            createLimbPair(type, side) {
                const container = document.createElement('div');
                container.className = `limb-container ${type}_${side}`;
                const upper = document.createElement('div');
                upper.className = `joint-upper ${type}_${side}`;
                upper.style.transformOrigin = '50% 0%';
                container.appendChild(upper);
                const lower = document.createElement('div');
                lower.className = `joint-lower ${type}_${side}`;
                lower.style.transformOrigin = '50% 0%';
                lower.style.position = 'absolute';
                lower.style.top = '100%';
                lower.style.left = '0';
                upper.appendChild(lower);
                const paw = this.createPaw(side);
                paw.style.position = 'absolute';
                paw.style.top = '100%';
                paw.style.left = '50%';
                paw.style.transform = 'translateX(-50%)';
                lower.appendChild(paw);
                return container;
            }

            createHumanLimb(type, side) {
                const container = document.createElement('div');
                container.className = `limb-container human ${type}_${side}`;
                const upper = document.createElement('div');
                upper.className = `joint-upper human ${type}_${side}`;
                upper.style.transformOrigin = '50% 0%';
                container.appendChild(upper);
                const middle = document.createElement('div');
                middle.className = `joint-middle human ${type}_${side}`;
                middle.style.transformOrigin = '50% 0%';
                middle.style.position = 'absolute';
                middle.style.top = '100%';
                middle.style.left = '0';
                upper.appendChild(middle);
                if (type === 'upperlimb') {
                    const hand = this.createHand(side);
                    hand.style.position = 'absolute';
                    hand.style.top = '100%';
                    hand.style.left = '50%';
                    hand.style.transform = 'translateX(-50%)';
                    middle.appendChild(hand);
                } else {
                    const foot = this.createFoot(side);
                    foot.style.position = 'absolute';
                    foot.style.top = '100%';
                    foot.style.left = '50%';
                    foot.style.transform = 'translateX(-50%)';
                    middle.appendChild(foot);
                }
                return container;
            }

            createTail(segments = 3) {
                const container = document.createElement('div');
                container.className = 'tail-container';
                let prevSegment = null;
                for (let i = 0; i < segments; i++) {
                    const segment = document.createElement('div');
                    segment.className = `joint-tail segment_${i + 1}`;
                    if (i === 0) { segment.style.transformOrigin = '0% 50%';
                        container.appendChild(segment); } else { segment.style.transformOrigin = '0% 50%';
                        segment.style.position = 'absolute';
                        segment.style.left = '-18px';
                        prevSegment.appendChild(segment); }
                    prevSegment = segment;
                }
                return container;
            }

            createEar(side) {
                const ear = document.createElement('div');
                ear.className = `joint-ear ${side}`;
                ear.style.transformOrigin = '100% 100%';
                ear.style.width = '15px';
                ear.style.height = '25px';
                ear.style.background = '#ffb6c1';

                face.style.height = '30px';

                const eyeRight = document.createElement('div');
                eyeRight.className = 'joint-eye right';
                Object.assign(eyeRight.style, { width: '8px', height: '8px', background: '#000',

            createPaw(side) {
                const paw = document.createElement('div');
                paw.className = `joint-paw ${side}`;
                paw.style.width = '20px';
                paw.style.height = '15px';
                paw.style.background = '#ffb6c1';
                paw.style.borderRadius = '50%';
                for (let i = 0; i < 4; i++) {
                    const toe = document.createElement('div');
                    toe.className = `joint-toe ${i + 1}`;
                    Object.assign(toe.style, { width: '5px', height: '8px', background: '#ffb6c1',
                        borderRadius: '50%', position: 'absolute', top: '-3px', left: `${5 + i * 3}px` });

            createHand(side) {
                const hand = document.createElement('div');

                hand.style.width = '15px';
                hand.style.height = '15px';
                hand.style.background = '#ffe0bd';
                hand.style.borderRadius = '50%';
                for (let i = 0; i < 5; i++) {
                    const finger = document.createElement('div');

                    Object.assign(finger.style, { width: '3px', height: '8px', background: '#ffe0bd',
                        borderRadius: '50%', position: 'absolute', top: '-5px', left: `${2 + i * 2.4}px` });
                    hand.appendChild(finger);

            createFoot(side) {
                const foot = document.createElement('div');
                foot.className = `joint-foot ${side}`;
                foot.style.width = '20px';
                foot.style.height = '12px';
                foot.style.background = '#4169e1';
                foot.style.borderRadius = '50%';
                for (let i = 0; i < 5; i++) {
                    const toe = document.createElement('div');
                    toe.className = `joint-toe ${i + 1}`;
                    Object.assign(toe.style, { width: '4px', height: '6px', background: '#4169e1',
                        borderRadius: '50%', position: 'absolute', top: '-2px', left: `${2 + i * 3.2}px` });
                    foot.appendChild(toe);
                }
                return foot;
            }

            // ---- 渲染 ----
            renderPet(container = this.petCharacter) {
                container.innerHTML = '';
                this.joints = {};
                const physicsContainer = document.createElement('div');
                physicsContainer.className = 'pet-physics';
                const shadow = document.createElement('div');
                shadow.className = 'pet-shadow';
                physicsContainer.appendChild(shadow);
                let skeleton;
                if (this.currentConfig.type === 'human') {
                    skeleton = this.createHumanSkeleton();
                    this.cacheJointsHuman(skeleton);
                    this.applyHumanParts(skeleton);
                } else {
                    skeleton = this.createAnimalSkeleton();
                    this.cacheJointsAnimal(skeleton);
                    this.applyAnimalParts(skeleton);
                }
                physicsContainer.appendChild(skeleton);
                container.appendChild(physicsContainer);
                this.physics = { container: physicsContainer, shadow: shadow };
                this.bindPartEvents();
            }

            cacheJointsAnimal(skeleton) {
                this.joints.root = skeleton;
                this.joints.torso = skeleton.querySelector('.joint-torso');
                this.joints.head = skeleton.querySelector('.joint-head');
                this.joints.ear_left = skeleton.querySelector('.joint-ear.left');
                this.joints.ear_right = skeleton.querySelector('.joint-ear.right');
                this.joints.eye_left = skeleton.querySelector('.joint-eye.left');
                this.joints.eye_right = skeleton.querySelector('.joint-eye.right');
                this.joints.nose = skeleton.querySelector('.joint-nose');
                this.joints.mouth = skeleton.querySelector('.joint-mouth');
                this.joints.forelimb_left_upper = skeleton.querySelector('.forelimb_left .joint-upper');
                this.joints.forelimb_left_lower = skeleton.querySelector('.forelimb_left .joint-lower');
                this.joints.forelimb_left_paw = skeleton.querySelector('.forelimb_left .joint-paw');
                this.joints.forelimb_right_upper = skeleton.querySelector('.forelimb_right .joint-upper');
                this.joints.forelimb_right_lower = skeleton.querySelector('.forelimb_right .joint-lower');
                this.joints.forelimb_right_paw = skeleton.querySelector('.forelimb_right .joint-paw');
                this.joints.hindlimb_left_upper = skeleton.querySelector('.hindlimb_left .joint-upper');
                this.joints.hindlimb_left_lower = skeleton.querySelector('.hindlimb_left .joint-lower');
                this.joints.hindlimb_left_paw = skeleton.querySelector('.hindlimb_left .joint-paw');
                this.joints.hindlimb_right_upper = skeleton.querySelector('.hindlimb_right .joint-upper');
                this.joints.hindlimb_right_lower = skeleton.querySelector('.hindlimb_right .joint-lower');
                this.joints.hindlimb_right_paw = skeleton.querySelector('.hindlimb_right .joint-paw');
                this.joints.tail_1 = skeleton.querySelector('.segment_1');
                this.joints.tail_2 = skeleton.querySelector('.segment_2');
                this.joints.tail_3 = skeleton.querySelector('.segment_3');
            }

            cacheJointsHuman(skeleton) {
                this.joints.root = skeleton;
                this.joints.torso = skeleton.querySelector('.joint-torso');
                this.joints.neck = skeleton.querySelector('.joint-neck');
                this.joints.head = skeleton.querySelector('.joint-head');
                this.joints.upperlimb_left_upper = skeleton.querySelector('.upperlimb_left .joint-upper');
                this.joints.upperlimb_left_middle = skeleton.querySelector('.upperlimb_left .joint-middle');
                this.joints.upperlimb_left_hand = skeleton.querySelector('.upperlimb_left .joint-hand');
                this.joints.upperlimb_right_upper = skeleton.querySelector('.upperlimb_right .joint-upper');
                this.joints.upperlimb_right_middle = skeleton.querySelector('.upperlimb_right .joint-middle');
                this.joints.upperlimb_right_hand = skeleton.querySelector('.upperlimb_right .joint-hand');
                this.joints.lowerlimb_left_upper = skeleton.querySelector('.lowerlimb_left .joint-upper');
                this.joints.lowerlimb_left_middle = skeleton.querySelector('.lowerlimb_left .joint-middle');
                this.joints.lowerlimb_left_foot = skeleton.querySelector('.lowerlimb_left .joint-foot');
                this.joints.lowerlimb_right_upper = skeleton.querySelector('.lowerlimb_right .joint-upper');
                this.joints.lowerlimb_right_middle = skeleton.querySelector('.lowerlimb_right .joint-middle');
                this.joints.lowerlimb_right_foot = skeleton.querySelector('.lowerlimb_right .joint-foot');
            }

            applyAnimalParts(skeleton) {
                const head = this.currentConfig.head;
                const headJoint = skeleton.querySelector('.joint-head');
                if (head && head.image) headJoint.style.backgroundImage = `url(${head.image})`;
                headJoint.style.backgroundSize = 'cover';
                headJoint.style.backgroundPosition = 'center';
                headJoint.style.backgroundRepeat = 'no-repeat';
                skeleton.querySelector('.joint-torso').style.background = '#ffb6c1';
                skeleton.querySelectorAll('.joint-upper, .joint-lower').forEach(l => { l.style.background =
                        '#ffb6c1';
                    l.style.borderRadius = '30%'; });
            }

            applyHumanParts(skeleton) {
                const parts = this.currentConfig.parts;
                const applyPart = (joint, partConfig, defaultBg, borderRadius) => {
                    if (!joint) return;
                    if (partConfig && partConfig.image) joint.style.backgroundImage =
                        `url(${partConfig.image})`;
                    else joint.style.background = defaultBg;
                    joint.style.backgroundSize = 'cover';
                    joint.style.backgroundPosition = 'center';
                    joint.style.borderRadius = borderRadius;
                };
                if (this.joints.head) applyPart(this.joints.head, parts.head, '#ffe0bd', '50%');
                if (this.joints.torso) applyPart(this.joints.torso, parts.torso, '#87ceeb', '20%');
                if (this.joints.upperlimb_left_upper) applyPart(this.joints.upperlimb_left_upper, parts.arm_left,
                    '#ffe0bd', '20%');
                if (this.joints.upperlimb_right_upper) applyPart(this.joints.upperlimb_right_upper, parts
                    .arm_right, '#ffe0bd', '20%');
                if (this.joints.lowerlimb_left_upper) applyPart(this.joints.lowerlimb_left_upper, parts.leg_left,
                    '#4169e1', '20%');
                if (this.joints.lowerlimb_right_upper) applyPart(this.joints.lowerlimb_right_upper, parts
                    .leg_right, '#4169e1', '20%');
            }

            renderPetTo(container, config) {
                container.innerHTML = '';
                if (config.type === 'human') {
                    const skeleton = this.createHumanSkeleton();
                    const parts = config.parts;
                    const applyPart = (selector, partConfig, defaultBg, borderRadius) => {
                        const joint = skeleton.querySelector(selector);
                        if (!joint) return;
                        if (partConfig && partConfig.image) joint.style.backgroundImage =
                            `url(${partConfig.image})`;
                        else joint.style.background = defaultBg;
                        joint.style.backgroundSize = 'cover';
                        joint.style.borderRadius = borderRadius;
                    };
                    applyPart('.joint-head', parts.head, '#ffe0bd', '50%');
                    applyPart('.joint-torso', parts.torso, '#87ceeb', '20%');
                    applyPart('.upperlimb_left .joint-upper', parts.arm_left, '#ffe0bd', '20%');
                    applyPart('.upperlimb_right .joint-upper', parts.arm_right, '#ffe0bd', '20%');
                    applyPart('.lowerlimb_left .joint-upper', parts.leg_left, '#4169e1', '20%');
                    applyPart('.lowerlimb_right .joint-upper', parts.leg_right, '#4169e1', '20%');
                    container.appendChild(skeleton);
                } else {
                    const skeleton = this.createAnimalSkeleton();
                    const head = config.head;
                    const headJoint = skeleton.querySelector('.joint-head');
                    if (head && head.image) headJoint.style.backgroundImage = `url(${head.image})`;
                    headJoint.style.backgroundSize = 'cover';
                    headJoint.style.transform =
                        `translateX(-50%) translate(${head.x}px,${head.y}px) scale(${head.scale}) rotate(${head.rotate}deg)`;
                    container.appendChild(skeleton);
                }
            }

            resetJoints() {
                for (const joint of Object.values(this.joints)) { if (joint) joint.style.transform = ''; }
            }

            // ---- 动作系统 ----
            executeAction(action) { this.actionQueue.push(action); if (!this.isActionRunning) this
                .processQueue(); }
            processQueue() {
                if (this.actionQueue.length === 0) { this.isActionRunning = false; return; }
                this.isActionRunning = true;
                const action = this.actionQueue.shift();
                this.playAction(action).then(() => this.processQueue());
            }
            playAction(action) {
                return new Promise(resolve => {
                    const duration = 1500;
                    switch (action) {
                        case 'dance':
                            this.showBubble('跳舞中~');
                            this.animateDance(duration).then(resolve);
                            break;
                        case 'circle':
                            this.showBubble('转圈中~');
                            this.animateCircle(duration).then(resolve);
                            break;
                        case 'greet':
                            this.showBubble('你好呀！');
                            this.animateGreet(duration).then(resolve);
                            break;
                        case 'handshake':
                            this.showBubble('握手~');
                            this.animateHandshake().then(resolve);
                            break;
                        case 'heart':
                            this.showBubble('比心~');
                            this.animateHeart(duration).then(resolve);
                            break;
                        case 'sit':
                            this.showBubble('坐下~');
                            this.animateSit(duration).then(resolve);
                            break;
                        case 'jump':
                            this.showBubble('跳~');
                            this.animateJump(duration).then(resolve);
                            break;
                        case 'walk':
                            this.showBubble('走路~');
                            this.animateWalk(duration).then(resolve);
                            break;
                        default:
                            this.animateBounce(1000).then(resolve);
                    }
                });
            }

            async animateDance(duration) {
                const startTime = Date.now();
                return new Promise(resolve => {
                    const animate = () => {
                        if (Date.now() - startTime < duration) {
                            const progress = (Date.now() - startTime) / duration;
                            const offset = Math.sin(progress * Math.PI * 6) * 15;
                            const offset2 = Math.sin(progress * Math.PI * 4) * 10;
                            if (this.currentConfig.type === 'human') {
                                if (this.joints.upperlimb_left_upper) this.joints.upperlimb_left_upper
                                    .style.transform = `rotate(${offset}deg)`;
                                if (this.joints.upperlimb_right_upper) this.joints.upperlimb_right_upper
                                    .style.transform = `rotate(${-offset}deg)`;
                                if (this.joints.upperlimb_left_middle) this.joints.upperlimb_left_middle
                                    .style.transform = `rotate(${offset2}deg)`;
                                if (this.joints.upperlimb_right_middle) this.joints.upperlimb_right_middle
                                    .style.transform = `rotate(${-offset2}deg)`;
                                if (this.joints.lowerlimb_left_upper) this.joints.lowerlimb_left_upper
                                    .style.transform = `rotate(${offset*0.5}deg)`;
                                if (this.joints.lowerlimb_right_upper) this.joints.lowerlimb_right_upper
                                    .style.transform = `rotate(${-offset*0.5}deg)`;
                                if (this.joints.torso) this.joints.torso.style.transform =
                                    `rotate(${offset*0.3}deg)`;
                                if (this.joints.neck) this.joints.neck.style.transform =
                                    `rotate(${offset*0.2}deg)`;
                                if (this.joints.head) this.joints.head.style.transform =
                                    `translateX(-50%) rotate(${offset*0.1}deg)`;
                            } else {
                                if (this.joints.head) this.joints.head.style.transform =
                                    `translateX(-50%) rotate(${offset}deg)`;
                                if (this.joints.ear_left) this.joints.ear_left.style.transform =
                                    `rotate(${offset2}deg)`;
                                if (this.joints.ear_right) this.joints.ear_right.style.transform =
                                    `rotate(${-offset2}deg)`;
                                if (this.joints.torso) this.joints.torso.style.transform =
                                    `rotate(${offset*0.5}deg)`;
                                if (this.joints.forelimb_left_upper) this.joints.forelimb_left_upper.style
                                    .transform = `rotate(${offset}deg)`;
                                if (this.joints.forelimb_right_upper) this.joints.forelimb_right_upper.style
                                    .transform = `rotate(${-offset}deg)`;
                                if (this.joints.hindlimb_left_upper) this.joints.hindlimb_left_upper.style
                                    .transform = `rotate(${-offset*0.5}deg)`;
                                if (this.joints.hindlimb_right_upper) this.joints.hindlimb_right_upper.style
                                    .transform = `rotate(${offset*0.5}deg)`;
                                if (this.joints.tail_1) this.joints.tail_1.style.transform =
                                    `rotate(${-offset}deg)`;
                                if (this.joints.tail_2) this.joints.tail_2.style.transform =
                                    `rotate(${offset*1.5}deg)`;
                                if (this.joints.tail_3) this.joints.tail_3.style.transform =
                                    `rotate(${offset*2}deg)`;
                            }
                            requestAnimationFrame(animate);
                        } else { this.resetJoints();
                            resolve(); }
                    };
                    animate();
                });
            }

            async animateCircle(duration) {
                const startTime = Date.now();
                return new Promise(resolve => {
                    const animate = () => {
                        if (Date.now() - startTime < duration) {
                            const progress = (Date.now() - startTime) / duration;
                            const angle = progress * Math.PI * 4;
                            if (this.joints.root) this.joints.root.style.transform =
                                `rotate(${Math.sin(angle)*10}deg)`;
                            requestAnimationFrame(animate);
                        } else { this.resetJoints();
                            resolve(); }
                    };
                    animate();
                });
            }

            async animateGreet(duration) {
                if (this.joints.root) {
                    this.joints.root.style.transition = `transform ${duration*0.5}ms`;
                    this.joints.root.style.transform = 'scale(1.2)';
                    await new Promise(r => setTimeout(r, duration * 0.5));
                    this.joints.root.style.transform = 'scale(1)';
                    await new Promise(r => setTimeout(r, duration * 0.5));
                    this.joints.root.style.transition = '';
                }
                return Promise.resolve();
            }

            async animateHandshake() {
                return new Promise(resolve => {
                    const limb = this.currentConfig.type === 'human' ? this.joints.upperlimb_right_upper :
                        this.joints.forelimb_right_upper;
                    if (limb) {
                        limb.style.transition = 'transform 0.5s';
                        limb.style.transform = 'rotate(-30deg)';
                        setTimeout(() => { limb.style.transform = 'rotate(0deg)';
                            limb.style.transition = '';
                            resolve(); }, 1200);
                    } else resolve();
                });
            }

            async animateHeart(duration) {
                const startTime = Date.now();
                return new Promise(resolve => {
                    const animate = () => {
                        if (Date.now() - startTime < duration) {
                            const progress = (Date.now() - startTime) / duration;
                            const scale = 1 + Math.sin(progress * Math.PI * 3) * 0.2;
                            if (this.currentConfig.type === 'human') {
                                if (this.joints.upperlimb_left_upper) this.joints.upperlimb_left_upper
                                    .style.transform = 'rotate(30deg)';
                                if (this.joints.upperlimb_right_upper) this.joints.upperlimb_right_upper
                                    .style.transform = 'rotate(-30deg)';
                                if (this.joints.torso) this.joints.torso.style.transform =
                                    `scale(${scale})`;
                            } else {
                                if (this.joints.head) this.joints.head.style.transform =
                                    `translateX(-50%) scale(${scale})`;
                            }
                            requestAnimationFrame(animate);
                        } else { this.resetJoints();
                            resolve(); }
                    };
                    animate();
                });
            }

            async animateSit(duration) {
                const targets = this.currentConfig.type === 'human' ? [
                    [this.joints.lowerlimb_left_upper, '90deg'],
                    [this.joints.lowerlimb_right_upper, '90deg'],
                    [this.joints.lowerlimb_left_middle, '-90deg'],
                    [this.joints.lowerlimb_right_middle, '-90deg']
                ] : [
                    [this.joints.hindlimb_left_upper, '60deg'],
                    [this.joints.hindlimb_right_upper, '60deg']
                ];
                targets.forEach(([joint, val]) => { if (joint) { joint.style.transition =
                        `transform ${duration*0.6}ms`;
                        joint.style.transform = `rotate(${val})`; } });
                await new Promise(r => setTimeout(r, duration));
                return Promise.resolve();
            }

            async animateJump(duration) {
                const startTime = Date.now();
                return new Promise(resolve => {
                    const animate = () => {
                        if (Date.now() - startTime < duration) {
                            const progress = (Date.now() - startTime) / duration;
                            const offset = Math.sin(progress * Math.PI) * 20;
                            const shadowScale = 1 - (offset / 40);
                            const shadowOpacity = 0.2 - (offset / 200);
                            if (this.joints.root) this.joints.root.style.transform =
                                `translateY(${-offset}px)`;
                            if (this.physics?.shadow) {
                                this.physics.shadow.style.transform =
                                    `translateX(-50%) scale(${shadowScale})`;
                                this.physics.shadow.style.opacity = shadowOpacity;
                            }
                            requestAnimationFrame(animate);
                        } else {
                            this.resetJoints();
                            if (this.physics?.shadow) {
                                this.physics.shadow.style.transform = 'translateX(-50%) scale(1)';
                                this.physics.shadow.style.opacity = '0.2';
                            }
                            resolve();
                        }
                    };
                    animate();
                });
            }

            async animateWalk(duration) {
                const startTime = Date.now();
                return new Promise(resolve => {
                    const animate = () => {
                        if (Date.now() - startTime < duration) {
                            const progress = (Date.now() - startTime) / duration;
                            const swing = Math.sin(progress * Math.PI * 4) * 20;
                            const swing2 = Math.sin(progress * Math.PI * 4 + Math.PI) * 15;
                            const offset = Math.sin(progress * Math.PI * 2) * 5;
                            if (this.currentConfig.type === 'human') {
                                if (this.joints.lowerlimb_left_upper) this.joints.lowerlimb_left_upper
                                    .style.transform = `rotate(${swing}deg)`;
                                if (this.joints.lowerlimb_right_upper) this.joints.lowerlimb_right_upper
                                    .style.transform = `rotate(${-swing}deg)`;
                                if (this.joints.lowerlimb_left_middle) this.joints.lowerlimb_left_middle
                                    .style.transform = `rotate(${-swing2}deg)`;
                                if (this.joints.lowerlimb_right_middle) this.joints.lowerlimb_right_middle
                                    .style.transform = `rotate(${swing2}deg)`;
                                if (this.joints.upperlimb_left_upper) this.joints.upperlimb_left_upper
                                    .style.transform = `rotate(${-swing*0.3}deg)`;
                                if (this.joints.upperlimb_right_upper) this.joints.upperlimb_right_upper
                                    .style.transform = `rotate(${swing*0.3}deg)`;
                                if (this.joints.torso) this.joints.torso.style.transform =
                                    `rotate(${swing*0.1}deg) translateY(${offset}px)`;
                            } else {
                                if (this.joints.hindlimb_left_upper) this.joints.hindlimb_left_upper.style
                                    .transform = `rotate(${swing}deg)`;
                                if (this.joints.hindlimb_right_upper) this.joints.hindlimb_right_upper
                                    .style.transform = `rotate(${-swing}deg)`;
                                if (this.joints.hindlimb_left_lower) this.joints.hindlimb_left_lower.style
                                    .transform = `rotate(${-swing2}deg)`;
                                if (this.joints.hindlimb_right_lower) this.joints.hindlimb_right_lower
                                    .style.transform = `rotate(${swing2}deg)`;
                                if (this.joints.forelimb_left_upper) this.joints.forelimb_left_upper.style
                                    .transform = `rotate(${-swing*0.5}deg)`;
                                if (this.joints.forelimb_right_upper) this.joints.forelimb_right_upper.style
                                    .transform = `rotate(${swing*0.5}deg)`;
                                if (this.joints.tail_1) this.joints.tail_1.style.transform =
                                    `rotate(${-swing*0.3}deg)`;
                                if (this.joints.head) this.joints.head.style.transform =
                                    `translateX(-50%) rotate(${swing*0.1}deg) translateY(${offset}px)`;
                            }
                            requestAnimationFrame(animate);
                        } else { this.resetJoints();
                            resolve(); }
                    };
                    animate();
                });
            }

            async animateBounce(duration) {
                const startTime = Date.now();
                return new Promise(resolve => {
                    const animate = () => {
                        if (Date.now() - startTime < duration) {
                            const progress = (Date.now() - startTime) / duration;
                            const scale = 1 + Math.sin(progress * Math.PI * 2) * 0.15;
                            if (this.joints.root) this.joints.root.style.transform = `scale(${scale})`;
                            requestAnimationFrame(animate);
                        } else { this.resetJoints();
                            resolve(); }
                    };
                    animate();
                });
            }

            handleCommand(text) {
                const cmd = text.toLowerCase();
                if (cmd.includes('跳舞')) this.executeAction('dance');
                else if (cmd.includes('转圈')) this.executeAction('circle');
                else if (cmd.includes('握手')) this.executeAction('handshake');
                else if (cmd.includes('比心')) this.executeAction('heart');
                else if (cmd.includes('坐下') || cmd.includes('蹲')) this.executeAction('sit');
                else if (cmd.includes('跳')) this.executeAction('jump');
                else if (cmd.includes('走') || cmd.includes('散步')) this.executeAction('walk');
                else if (cmd.includes('你好') || cmd.includes('打招呼')) this.executeAction('greet');
                else this.showBubble('试试说：跳舞、转圈、握手、比心、坐下、跳跃、走路、打招呼');
            }

            showBubble(msg) {
                this.petBubble.textContent = msg;
                this.petBubble.style.display = 'block';
                clearTimeout(this._bubbleTimer);
                this._bubbleTimer = setTimeout(() => { this.petBubble.style.display = 'none'; }, 3000);
            }

            // ---- 部位点击交互 ----
            bindPartEvents() {
                setTimeout(() => {
                    this.bindPartClick('.joint-head', () => this.onHeadClick());
                    this.bindPartClick('.joint-ear', (e) => this.onEarClick(e));
                    this.bindPartClick('.joint-eye', (e) => this.onEyeClick(e));
                    this.bindPartClick('.joint-nose', () => this.onNoseClick());
                    this.bindPartClick('.joint-mouth', () => this.onMouthClick());
                    this.bindPartClick('.joint-paw', (e) => this.onPawClick(e));
                    this.bindPartClick('.joint-hand', (e) => this.onHandClick(e));
                    this.bindPartClick('.joint-foot', (e) => this.onFootClick(e));
                    this.bindPartClick('.joint-tail', (e) => this.onTailClick(e));
                    this.bindPartClick('.joint-torso', () => this.onTorsoClick());
                }, 100);
            }

            bindPartClick(selector, callback) {
                const elements = document.querySelectorAll(selector);
                elements.forEach(el => {
                    el.addEventListener('click', (e) => { e.stopPropagation();
                        callback(e); });
                    el.style.cursor = 'pointer';
                    el.style.transition = 'transform 0.2s';
                    el.addEventListener('mouseenter', () => { el.style.transform = 'scale(1.1)'; });
                    el.addEventListener('mouseleave', () => { el.style.transform = ''; });
                });
            }

            async onHeadClick() { this.showBubble('摸头好舒服～'); await this.animateHeadPet(); }
            async onEarClick(e) {
                const side = e.target.classList.contains('left') ? '左边' : '右边';
                this.showBubble(`你碰了我的${side}耳朵！`);
                await this.animateEarWiggle(side);
            }
            async onEyeClick(e) {
                const side = e.target.classList.contains('left') ? '左' : '右';
                this.showBubble(`你戳了我的${side}眼睛！`);
                await this.animateEyeBlink();
            }
            async onNoseClick() { this.showBubble('嗯？你闻什么呢？'); await this.animateNoseTwitch(); }
            async onMouthClick() { this.showBubble('我现在不饿哦～'); await this.animateMouthSmile(); }
            async onPawClick(e) {
                const side = e.target.classList.contains('left') ? '左' : '右';
                this.showBubble(`你握了我的${side}爪子！`);
                await this.animatePawWave(side);
            }
            async onHandClick(e) {
                const side = e.target.classList.contains('left') ? '左' : '右';
                this.showBubble(`你握了我的${side}手！`);
                await this.animateHandWave(side);
            }
            async onFootClick(e) {
                const side = e.target.classList.contains('left') ? '左' : '右';
                this.showBubble(`你碰了我的${side}脚！`);
                await this.animateFootTap(side);
            }
            async onTailClick() { this.showBubble('尾巴是我的敏感部位！'); await this.animateTailWag(); }
            async onTorsoClick() { this.showBubble('肚子好痒～'); await this.animateTorsoScratch(); }

            async animateHeadPet() {
                if (this.joints.head) {
                    this.joints.head.style.transition = 'transform 0.3s';
                    this.joints.head.style.transform = 'translateX(-50%) scale(1.1)';
                    await new Promise(r => setTimeout(r, 300));
                    this.joints.head.style.transform = 'translateX(-50%) scale(1)';
                    await new Promise(r => setTimeout(r, 200));
                    this.joints.head.style.transition = '';
                }
            }
            async animateEarWiggle(side) {
                const ear = side === '左边' ? this.joints.ear_left : this.joints.ear_right;
                if (ear) {
                    ear.style.transition = 'transform 0.2s';
                    for (let i = 0; i < 3; i++) { ear.style.transform = 'rotate(10deg)'; await new Promise(r =>
                            setTimeout(r, 100));
                        ear.style.transform = 'rotate(-10deg)'; await new Promise(r => setTimeout(r, 100)); }
                    ear.style.transform = '';
                    ear.style.transition = '';
                }
            }
            async animateEyeBlink() {
                const eyes = [this.joints.eye_left, this.joints.eye_right];
                eyes.forEach(eye => { if (eye) { eye.style.transition = 'transform 0.1s';
                        eye.style.transform = 'scaleY(0.1)'; } });
                await new Promise(r => setTimeout(r, 100));
                eyes.forEach(eye => { if (eye) { eye.style.transform = '';
                        eye.style.transition = ''; } });
            }
            async animateNoseTwitch() {
                if (this.joints.nose) {
                    this.joints.nose.style.transition = 'transform 0.1s';
                    for (let i = 0; i < 3; i++) { this.joints.nose.style.transform =
                            'translateX(-50%) scale(1.1)'; await new Promise(r => setTimeout(r, 80));
                        this.joints.nose.style.transform = 'translateX(-50%) scale(1)'; await new Promise(r =>
                            setTimeout(r, 80)); }
                    this.joints.nose.style.transition = '';
                }
            }
            async animateMouthSmile() {
                if (this.joints.mouth) {
                    this.joints.mouth.style.transition = 'transform 0.3s';
                    this.joints.mouth.style.transform = 'translateX(-50%) scale(1.2)';
                    await new Promise(r => setTimeout(r, 300));
                    this.joints.mouth.style.transform = 'translateX(-50%) scale(1)';
                    this.joints.mouth.style.transition = '';
                }
            }
            async animatePawWave(side) {
                const limb = side === '左' ? this.joints.forelimb_left_upper : this.joints.forelimb_right_upper;
                if (limb) { limb.style.transition = 'transform 0.5s';
                    limb.style.transform = 'rotate(-30deg)'; await new Promise(r => setTimeout(r, 500));
                    limb.style.transform = 'rotate(0deg)';
                    limb.style.transition = ''; }
            }
            async animateHandWave(side) {
                const limb = side === '左' ? this.joints.upperlimb_left_upper : this.joints.upperlimb_right_upper;
                if (limb) { limb.style.transition = 'transform 0.5s';
                    limb.style.transform = 'rotate(-45deg)'; await new Promise(r => setTimeout(r, 500));
                    limb.style.transform = 'rotate(0deg)';
                    limb.style.transition = ''; }
            }
            async animateFootTap(side) {
                const limb = side === '左' ? this.joints.lowerlimb_left_upper : this.joints.lowerlimb_right_upper;
                if (limb) { limb.style.transition = 'transform 0.2s'; for (let i = 0; i < 3; i++) { limb.style
                            .transform = 'rotate(10deg)'; await new Promise(r => setTimeout(r, 100));
                        limb.style.transform = 'rotate(0deg)'; await new Promise(r => setTimeout(r, 100)); }
                    limb.style.transition = ''; }
            }
            async animateTailWag() {
                const tail = this.joints.tail_1;
                if (tail) { tail.style.transition = 'transform 0.2s'; for (let i = 0; i < 5; i++) { tail.style
                            .transform = 'rotate(20deg)'; await new Promise(r => setTimeout(r, 100));
                        tail.style.transform = 'rotate(-20deg)'; await new Promise(r => setTimeout(r, 100)); }
                    tail.style.transform = '';
                    tail.style.transition = ''; }
            }
            async animateTorsoScratch() {
                if (this.joints.torso) { this.joints.torso.style.transition = 'transform 0.3s'; for (let i = 0; i <
                        3; i++) { this.joints.torso.style.transform = 'rotate(10deg)'; await new Promise(r =>
                            setTimeout(r, 200));
                        this.joints.torso.style.transform = 'rotate(-10deg)'; await new Promise(r => setTimeout(r,
                            200)); }
                    this.joints.torso.style.transform = '';
                    this.joints.torso.style.transition = ''; }
            }

            // ---- 拖拽 ----
            enableDrag() {
                let dragging = false,
                    startX, startY, initialLeft, initialTop;
                const container = this.petCharacter.parentElement;
                if (!container) return;
                container.addEventListener('mousedown', (e) => {
                    if (e.target.closest('#petWindow') || e.target.closest('.skeleton-root') || e.target
                        .closest('#petEditor')) return;
                    dragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    const rect = container.getBoundingClientRect();
                    initialLeft = rect.left;
                    initialTop = rect.top;
                });
                window.addEventListener('mousemove', (e) => {
                    if (!dragging) return;
                    const dx = e.clientX - startX,
                        dy = e.clientY - startY;
                    container.style.left = `${initialLeft + dx}px`;
                    container.style.top = `${initialTop + dy}px`;
                });
                window.addEventListener('mouseup', () => { dragging = false; });
            }

            // ---- 语音 ----
            initSpeech() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    this.recognizer = new SpeechRecognition();
                    this.recognizer.lang = 'zh-CN';
                    this.recognizer.onresult = (e) => { const text = e.results[0][0].transcript;
                        this.handleCommand(text); };
                }
            }
            startVoice() { if (this.recognizer) { this.recognizer.start();
                    this.showBubble('正在听...'); } }

            // ---- 编辑器 ----
            openEditor() {
                this.editingConfig = JSON.parse(JSON.stringify(this.currentConfig));
                this.petEditor.style.display = 'flex';
                this.updateEditorUI();
            }
            closeEditor() { this.petEditor.style.display = 'none'; }
            updateEditorUI() {
                document.querySelectorAll('.petTypeBtn').forEach(btn => btn.style.background = '');
                const activeBtn = document.querySelector(`.petTypeBtn[data-type="${this.editingConfig.type}"]`);
                if (activeBtn) activeBtn.style.background = 'var(--btn-hover)';
                this.renderPetTo(this.petPreview, this.editingConfig);
                this.updateEditPanel();
            }
            updateEditPanel() {
                const type = this.editingConfig.type;
                let html = '';
                if (type === 'dog' || type === 'cat') {
                    html = `
                        <h3 style="color:var(--text-color);">头部编辑</h3>

                        <div class="slider-group"><label>旋转: <span id="headRotateVal">${this.editingConfig.head.rotate}</span>°</label><input type="range" id="headRotate" min="-180" max="180" value="${this.editingConfig.head.rotate}"></div>
                        <div class="slider-group"><label>水平位移: <span id="headXVal">${this.editingConfig.head.x}</span></label><input type="range" id="headX" min="-30" max="30" value="${this.editingConfig.head.x}"></div>
                        <div class="slider-group"><label>垂直位移: <span id="headYVal">${this.editingConfig.head.y}</span></label><input type="range" id="headY" min="-30" max="30" value="${this.editingConfig.head.y}"></div>
                        <div><label style="color:var(--text-color);">上传头像:</label><input type="file" id="headUpload" accept="image/*"></div>`;
                } else {
                    html = `
                        <h3 style="color:var(--text-color);">选择部位</h3>
                        <select id="partSelect" style="width:100%;padding:8px;border-radius:8px;">${['head','torso','arm_left','arm_right','leg_left','leg_right'].map(p => `<option value="${p}">${p}</option>`).join('')}</select>
                        <div class="slider-group"><label>缩放: <span id="partScaleVal">1</span></label><input type="range" id="partScale" min="0.5" max="2" step="0.1" value="1"></div>
                        <div class="slider-group"><label>旋转: <span id="partRotateVal">0</span>°</label><input type="range" id="partRotate" min="-180" max="180" value="0"></div>
                        <div class="slider-group"><label>X位移: <span id="partXVal">0</span></label><input type="range" id="partX" min="-30" max="30" value="0"></div>
                        <div class="slider-group"><label>Y位移: <span id="partYVal">0</span></label><input type="range" id="partY" min="-30" max="30" value="0"></div>
                        <div><label style="color:var(--text-color);">上传图片:</label><input type="file" id="partUpload" accept="image/*"></div>
                        <button id="mirrorBtn" class="auth-btn" style="margin-top:10px;width:100%;">镜像到对称部位</button>`;
                }
                this.editPanelContent.innerHTML = html;
                this.bindEditorControls(type);
            }
            bindEditorControls(type) {
                if (type === 'dog' || type === 'cat') {
                    const update = () => this.updateEditorUI();
                    document.getElementById('headScale')?.addEventListener('input', (e) => { this.editingConfig
                            .head.scale = parseFloat(e.target.value);
                        document.getElementById('headScaleVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('headRotate')?.addEventListener('input', (e) => { this.editingConfig
                            .head.rotate = parseFloat(e.target.value);
                        document.getElementById('headRotateVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('headX')?.addEventListener('input', (e) => { this.editingConfig.head
                            .x = parseInt(e.target.value);
                        document.getElementById('headXVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('headY')?.addEventListener('input', (e) => { this.editingConfig.head
                            .y = parseInt(e.target.value);
                        document.getElementById('headYVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('headUpload')?.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) { const reader = new FileReader();
                            reader.onload = (ev) => { this.editingConfig.head.image = ev.target.result;
                                update(); };
                            reader.readAsDataURL(file); }
                    });
                } else {
                    const partSelect = document.getElementById('partSelect');
                    const updatePartUI = () => {
                        const part = partSelect.value;
                        const config = this.editingConfig.parts[part];
                        if (config) {
                            document.getElementById('partScale').value = config.scale;
                            document.getElementById('partScaleVal').textContent = config.scale;
                            document.getElementById('partRotate').value = config.rotate;
                            document.getElementById('partRotateVal').textContent = config.rotate;
                            document.getElementById('partX').value = config.x;
                            document.getElementById('partXVal').textContent = config.x;
                            document.getElementById('partY').value = config.y;
                            document.getElementById('partYVal').textContent = config.y;
                        }
                    };
                    updatePartUI();
                    partSelect?.addEventListener('change', updatePartUI);
                    const update = () => this.updateEditorUI();
                    document.getElementById('partScale')?.addEventListener('input', (e) => { this.editingConfig
                            .parts[partSelect.value].scale = parseFloat(e.target.value);
                        document.getElementById('partScaleVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('partRotate')?.addEventListener('input', (e) => { this.editingConfig
                            .parts[partSelect.value].rotate = parseFloat(e.target.value);
                        document.getElementById('partRotateVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('partX')?.addEventListener('input', (e) => { this.editingConfig.parts[
                            partSelect.value].x = parseInt(e.target.value);
                        document.getElementById('partXVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('partY')?.addEventListener('input', (e) => { this.editingConfig.parts[
                            partSelect.value].y = parseInt(e.target.value);
                        document.getElementById('partYVal').textContent = e.target.value;
                        update(); });
                    document.getElementById('partUpload')?.addEventListener('change', (e) => {
                        const part = partSelect.value;
                        const file = e.target.files[0];
                        if (file) { const reader = new FileReader();
                            reader.onload = (ev) => { this.editingConfig.parts[part].image = ev.target
                                    .result;
                                update(); };
                            reader.readAsDataURL(file); }
                    });
                    document.getElementById('mirrorBtn')?.addEventListener('click', () => {
                        const part = partSelect.value;
                        const mirrorMap = { arm_left: 'arm_right', arm_right: 'arm_left', leg_left: 'leg_right',
                            leg_right: 'leg_left' };
                        const mirrorPart = mirrorMap[part];
                        if (mirrorPart) { this.editingConfig.parts[mirrorPart] = JSON.parse(JSON.stringify(
                                this.editingConfig.parts[part]));
                            this.editingConfig.parts[mirrorPart].x = -this.editingConfig.parts[part].x;
                            update(); }
                    });
                }
            }
            savePet() {
                this.currentConfig = JSON.parse(JSON.stringify(this.editingConfig));
                this.saveConfig();
                this.renderPet();
                this.closeEditor();
                this.showBubble('形象已保存！');
            }

            // ---- 事件绑定 ----
            bindEvents() {
                document.getElementById('petSendBtn')?.addEventListener('click', () => {
                    const input = document.getElementById('petInput');
                    this.handleCommand(input.value);
                    input.value = '';
                });
                document.getElementById('petVoiceBtn')?.addEventListener('click', () => this.startVoice());
                document.querySelectorAll('.petCommandBtn').forEach(btn => {
                    btn.addEventListener('click', () => this.executeAction(btn.dataset.command));
                });
                document.getElementById('customizePetBtn')?.addEventListener('click', () => this.openEditor());
                document.getElementById('savePetBtn')?.addEventListener('click', () => this.savePet());
                document.getElementById('cancelPetBtn')?.addEventListener('click', () => this.closeEditor());
                document.querySelectorAll('.petTypeBtn').forEach(btn => {
                    btn.addEventListener('click', () => { this.editingConfig.type = btn.dataset.type;
                        this.updateEditorUI(); });
                });
                document.getElementById('closePetWindow')?.addEventListener('click', () => { this.petWindow.style
                        .display = 'none'; });
                this.petCharacter?.addEventListener('click', (e) => {
                    if (!e.target.closest('.skeleton-root') && !e.target.closest('#petWindow')) {
                        this.petWindow.style.display = this.petWindow.style.display === 'none' ? 'block' :
                            'none';
                    }
                });
            }
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            window.pet = new PetModule();
        });
    </script>
</body>
</html>
